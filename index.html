<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metronom</title>
  <style>
    :root {
      --primary-color: #007bff;
      --running-color: #dc3545;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --flash-color: rgba(0, 123, 255, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      transition: background-color 0.08s ease;
    }

    body.flash-active {
      background-color: var(--flash-color);
    }

    .card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      color: #333;
    }

    .visual-indicator {
      width: 24px;
      height: 24px;
      background-color: #e0e0e0;
      border-radius: 50%;
      margin: 0 auto 15px auto;
      transition: background-color 0.05s ease, box-shadow 0.05s ease;
    }

    .visual-indicator.ready {
      background-color: #bbdefb;
    }

    .visual-indicator.active {
      background-color: var(--primary-color);
      box-shadow: 0 0 16px var(--primary-color);
    }

    .display {
      font-size: 2.6rem;
      font-weight: 800;
      color: var(--primary-color);
      margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    .sub-display {
      font-size: 1.25rem;
      font-weight: 600;
      color: #495057;
      margin-bottom: 20px;
      font-variant-numeric: tabular-nums;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
      font-size: 0.95rem;
    }

    input[type=range] {
      width: 100%;
      margin-bottom: 25px;
      cursor: pointer;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }

    button.running {
      background-color: var(--running-color);
    }

    footer {
      margin-top: 25px;
      font-size: 0.8rem;
      color: #888;
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Metronom</h1>
    
    <div class="visual-indicator" id="indicator"></div>
    
    <!-- Anzeige Periodendauer T -->
    <div class="display">T = <span id="wert">1.00</span> s</div>
    
    <!-- Anzeige Frequenz f = 1/T -->
    <div class="sub-display">f = <span id="freq">1.00</span> Hz</div>
    
    <label for="regler">Periodendauer (0,1 bis 6,0 s):</label>
    <input type="range" id="regler" min="0.1" max="6.0" step="0.05" value="1.00">
    
    <button id="toggleBtn">Start</button>
  </div>

  <footer>
    <p>Kontakt: Noah Buchmann &bull; Hugo-Ball-Gymnasium Pirmasens</p>
  </footer>

  <script>
    let audioCtx = null;
    let timer = null;
    let isRunning = false;
    const flashDuration = 50;

    const regler = document.getElementById('regler');
    const wert = document.getElementById('wert');
    const freq = document.getElementById('freq');
    const toggleBtn = document.getElementById('toggleBtn');
    const indicator = document.getElementById('indicator');
    const body = document.body;

    function aktualisiereWerte() {
      const t = parseFloat(regler.value);
      wert.textContent = t.toFixed(2);
      // Frequenz berechnen: f = 1 / T
      freq.textContent = (1 / t).toFixed(2);
    }

    regler.addEventListener('input', () => {
      aktualisiereWerte();
      if (isRunning) {
        clearInterval(timer);
        timer = setInterval(beat, parseFloat(regler.value) * 1000);
      }
    });

    function beat() {
      // Audio-Impuls abspielen
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);

      // Visueller Impuls
      indicator.classList.add('active');
      body.classList.add('flash-active');

      setTimeout(() => {
        indicator.classList.remove('active');
        body.classList.remove('flash-active');
      }, flashDuration);
    }

    toggleBtn.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      if (isRunning) {
        clearInterval(timer);
        isRunning = false;
        toggleBtn.textContent = 'Start';
        toggleBtn.classList.remove('running');
        indicator.classList.remove('ready');
      } else {
        beat();
        timer = setInterval(beat, parseFloat(regler.value) * 1000);
        isRunning = true;
        toggleBtn.textContent = 'Stopp';
        toggleBtn.classList.add('running');
        indicator.classList.add('ready');
      }
    });

    // Initiale Berechnung beim Start
    aktualisiereWerte();
  </script>
</body>
</html>
